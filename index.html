<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRAVINHOS</title>
<meta name="description" content="Todos os meus conteúdos exclusivos">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060b16;
    --card:#0f1828;
    --card-hover:#142038;
    --border:#1e3354;
    --accent:#3b82f6;
    --accent-rgb:59,130,246;
    --text:#ffffff;
    --muted:#a9bcd9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:'Poppins',system-ui,sans-serif;
    color:var(--text);
    background:
      radial-gradient(ellipse 100% 55% at 50% 0%, rgba(var(--accent-rgb),.55), transparent 70%),
      radial-gradient(ellipse 60% 40% at 100% 100%, rgba(29,78,216,.45), transparent 70%),
      radial-gradient(ellipse 50% 35% at 0% 85%, rgba(14,165,233,.25), transparent 70%),
      var(--bg);
    background-attachment:fixed;
    display:flex;justify-content:center;
    padding:56px 18px 40px;
  }
  main{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center}

  .avatar{position:relative;width:112px;height:112px;margin-bottom:22px}
  .avatar img,.avatar .inicial{
    width:100%;height:100%;object-fit:cover;border-radius:50%;
    border:3px solid var(--accent);
    box-shadow:0 0 24px rgba(var(--accent-rgb),.6), 0 0 0 4px #0a0f1a inset;
    background:#111a2b;
  }
  .avatar .inicial{display:grid;place-items:center;font-family:'Anton',sans-serif;font-size:44px}
  .avatar .online{
    position:absolute;right:4px;bottom:6px;width:16px;height:16px;border-radius:50%;
    background:#22c55e;border:3px solid #0a0f1a;box-shadow:0 0 8px rgba(34,197,94,.8);
  }

  h1{
    font-family:'Anton',Impact,sans-serif;font-weight:400;
    font-size:40px;letter-spacing:3px;text-transform:uppercase;text-align:center;
    text-shadow:0 0 20px rgba(var(--accent-rgb),.7);
  }
  .subtitle{
    margin-top:8px;font-size:12px;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--muted);text-align:center;
  }
  .divider{
    width:44px;height:2px;margin:36px 0 34px;border-radius:2px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);
    box-shadow:0 0 8px var(--accent);
  }

  /* Cada botão usa a cor da sua plataforma (--c) */
  .links{width:100%;display:flex;flex-direction:column;gap:14px}
  .card{
    --c:#3b82f6; --c-rgb:59,130,246;
    position:relative;overflow:hidden;
    display:flex;align-items:center;gap:14px;
    padding:18px 18px 18px 22px;border-radius:16px;
    background:
      linear-gradient(90deg, rgba(var(--c-rgb),.16), rgba(var(--c-rgb),0) 60%),
      var(--card);
    border:1px solid rgba(var(--c-rgb),.45);
    color:inherit;text-decoration:none;
    transition:transform .15s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:var(--c);box-shadow:0 0 12px var(--c);
  }
  .card:hover{
    transform:translateY(-2px);
    background:
      linear-gradient(90deg, rgba(var(--c-rgb),.26), rgba(var(--c-rgb),.04) 70%),
      var(--card-hover);
    border-color:var(--c);
    box-shadow:0 0 20px rgba(var(--c-rgb),.35);
  }
  .card:active{transform:scale(.99)}
  .icon{
    width:52px;height:52px;flex-shrink:0;border-radius:12px;overflow:hidden;
    display:grid;place-items:center;font-family:'Anton',sans-serif;font-size:24px;
    background:var(--c);box-shadow:0 0 14px rgba(var(--c-rgb),.5);
  }
  .icon img{width:100%;height:100%;object-fit:cover}
  .info{flex:1;min-width:0}
  .title{font-family:'Anton',sans-serif;font-size:18px;letter-spacing:1px;text-transform:uppercase}
  .desc{font-size:13px;color:var(--muted);margin:2px 0 8px;line-height:1.35}
  .badge{
    display:inline-flex;align-items:center;gap:5px;
    font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;
    padding:3px 10px;border-radius:999px;border:1px solid var(--c);
    color:var(--c);background:rgba(var(--c-rgb),.1);
  }
  .chev{color:var(--c);font-size:22px;padding-left:4px}

  footer{margin-top:48px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#5d7090}

  @media (max-width:380px){ h1{font-size:34px} .desc{font-size:12px} }
</style>
</head>
<body>
<main>
  <div class="avatar">
    <img id="foto" alt="Foto de perfil">
    <span class="online" title="Online"></span>
  </div>

  <h1 id="nome"></h1>
  <p class="subtitle" id="subtitulo"></p>
  <div class="divider"></div>

  <nav class="links" id="links"></nav>

  <footer id="rodape"></footer>
</main>

/* ================================================================
   EDITE AQUI — é só trocar os textos, links e cores
   - cor: cor do botão (borda, faixa, ícone, selo e setinha)
   - icone: caminho de uma imagem (ex.: "icons/telegram.png").
     Se vazio ou não existir, aparece um quadrado na cor com a inicial.
   - selo: deixe "" para não mostrar
   ================================================================ */
const PERFIL = {
  nome: "CRAVINHOS",
  subtitulo: "Todos os meus conteúdos exclusivos",
  foto: FOTO,
};

const LINKS = [
  {
    titulo: "Telegram",
    descricao: "Acesso direto pelo meu bot",
    url: "https://t.me/Cravinhosbot",
    icone: "",
    cor: "#2aa8f0",
    selo: "⚡ Entre agora",
  },
  {
    titulo: "CloseFans",
    descricao: "Conteúdo completo exclusivo",
    url: "https://close.fans/cristiancravinhos",
    icone: "",
    cor: "#a855f7",
    selo: "🔥 Assine agora",
  },
  {
    titulo: "FatalFans",
    descricao: "Conteúdo completo exclusivo",
    url: "https://fatalfans.com/cristiancravinhos1",
    icone: "",
    cor: "#ef4444",
    selo: "🔥 Assine agora",
  },
];
/* ================================================================ */

const hexToRgb = h => {
  h = h.replace("#","");
  if (h.length === 3) h = h.split("").map(c => c + c).join("");
  const n = parseInt(h, 16);
  return [(n>>16)&255, (n>>8)&255, n&255].join(",");
};

document.title = PERFIL.nome;
document.getElementById("nome").textContent = PERFIL.nome;
document.getElementById("subtitulo").textContent = PERFIL.subtitulo;
document.getElementById("rodape").textContent = "© " + new Date().getFullYear() + " " + PERFIL.nome;

const foto = document.getElementById("foto");
const semFoto = () => {
  const d = document.createElement("div");
  d.className = "inicial";
  d.textContent = PERFIL.nome.charAt(0).toUpperCase();
  foto.replaceWith(d);
};
if (PERFIL.foto) { foto.onerror = semFoto; foto.src = PERFIL.foto; } else semFoto();

const lista = document.getElementById("links");
LINKS.forEach(l => {
  const a = document.createElement("a");
  a.className = "card";
  a.href = l.url;
  a.target = "_blank";
  a.rel = "noopener";
  a.style.setProperty("--c", l.cor);
  a.style.setProperty("--c-rgb", hexToRgb(l.cor));

  const icon = document.createElement("div");
  icon.className = "icon";
  const fallback = () => {
    icon.innerHTML = "";
    icon.textContent = l.titulo.charAt(0).toUpperCase();
  };
  if (l.icone) {
    const img = document.createElement("img");
    img.src = l.icone; img.alt = l.titulo;
    img.onerror = fallback;
    icon.appendChild(img);
  } else fallback();

  const info = document.createElement("div");
  info.className = "info";
  info.innerHTML = '<div class="title"></div><div class="desc"></div>';
  info.querySelector(".title").textContent = l.titulo;
  info.querySelector(".desc").textContent = l.descricao;
  if (l.selo) {
    const b = document.createElement("span");
    b.className = "badge";
    b.textContent = l.selo;
    info.appendChild(b);
  }

  const chev = document.createElement("span");
  chev.className = "chev"; chev.textContent = "›";

  a.append(icon, info, chev);
  lista.appendChild(a);
});
</script>
